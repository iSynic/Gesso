[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "`canvas-mcp`: the MCP server (stdio). Forwards to a running app over local IPC, or works headless."

[[bin]]
name = "canvas-mcp"
path = "src/main.rs"
bench = false

[dependencies]
agent = { path = "../../crates/agent" }
text = { path = "../../crates/text" }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "sync"] }
serde_json = "1.0.154"

[lints]
workspace = true
