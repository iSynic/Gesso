[workspace]
resolver = "3"
members = ["common", "render-vello", "render-skia", "text", "layout", "script", "shell-native", "shell-tauri/canvas", "shell-tauri/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "thin"
codegen-units = 1
