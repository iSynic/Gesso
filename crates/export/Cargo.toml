[package]
name = "export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
doc = { path = "../doc" }
text = { path = "../text" }
render = { path = "../render" }
render-cpu = { path = "../render-cpu" }
layout = { path = "../layout" }
index = { path = "../index" }
kurbo = "0.13.1"
peniko = "0.6.1"
skrifa = "0.44.0"
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
format = { path = "../format" }
serde_json = "1.0.154"
pdf-writer = "0.15.0"
subsetter = "0.2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1.1.10"
rustc-hash = "2.1.3"
rayon = "1.12.0"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
doc = { path = "../doc", features = ["testing"] }
serde_json = "1.0.154"
flate2 = "1.1.10"
text = { path = "../text" }
resvg = { version = "0.47.0", default-features = false, features = ["raster-images", "text"] }

[lib]
bench = false
