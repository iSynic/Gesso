[package]
name = "editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
doc = { path = "../doc" }
text = { path = "../text" }
layout = { path = "../layout" }
index = { path = "../index" }
format = { path = "../format" }
render = { path = "../render" }
export = { path = "../export" }
kurbo = "0.13.1"
peniko = "0.6.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
doc = { path = "../doc", features = ["testing"] }
proptest = "1.12.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[lib]
bench = false
