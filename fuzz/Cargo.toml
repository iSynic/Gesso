# cargo-fuzz targets (need nightly + libFuzzer; run on Linux CI): `cargo +nightly fuzz run open_json`
[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
doc = { path = "../crates/doc" }
format = { path = "../crates/format" }
serde_json = "1"
editor = { path = "../crates/editor" }
script = { path = "../crates/script" }
text = { path = "../crates/text" }
export = { path = "../crates/export" }

[[bin]]
name = "open_json"
path = "fuzz_targets/open_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_ops"
path = "fuzz_targets/apply_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script_api"
path = "fuzz_targets/script_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script_source"
path = "fuzz_targets/script_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg_import"
path = "fuzz_targets/svg_import.rs"
test = false
doc = false
bench = false
